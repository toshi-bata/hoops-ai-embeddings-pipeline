<!doctype html><meta charset='utf-8'><html lang='en'><title>HOOPS AI 1.1 benchmark (local Windows)</title><style>body{font-family:-apple-system,Segoe UI,Meiryo,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;line-height:1.6;color:#1a1a1a}table{border-collapse:collapse;margin:1rem 0;font-size:14px}th,td{border:1px solid #ddd;padding:6px 10px;text-align:right}th{background:#f5f5f5;text-align:left}td:first-child,th:first-child{text-align:left}code{background:#f5f5f5;padding:1px 4px;border-radius:3px}h1,h2,h3{line-height:1.25}h2{border-bottom:2px solid #eee;padding-bottom:.3rem}tr.peak td{background:#fff3cd;font-weight:600}td.peak{background:#fff3cd;font-weight:600}</style>
<div id='c'></div>
<script src='https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js'></script>
<script>document.getElementById('c').innerHTML=marked.parse("# HOOPS AI 1.1 benchmark (local Windows) - CPU vs GPU\n\nMachine: **local Windows laptop** (Intel 14-core + RTX 2000 Ada). Dataset: `parts500` failure-free 500-part sample.\nBenchmark runs: 40 succeeded, 0 failed or skipped. Raw data: `results/results.csv`, per-run logs in `logs/`.\n\nSee also the companion report for the other machine (`REPORT_local.*` / `REPORT_aws.*`).\n\n## Summary\n\nConclusions first; the supporting numbers and per-setting sweeps follow in each step's section.\n\n- **Step 1 (encoding) and Step 3 (embedding + indexing) are CPU-bound** - the GPU sits idle, so the GPU install buys nothing. Throughput scales with worker count up to roughly the machine's physical core count, then flattens.\n- **Step 2 (training) is not covered on this machine** - it was benchmarked separately on the AWS EC2 host (see `REPORT_aws.*`), where the L4 GPU is ~5.4x faster than the CPU at 10k scale.\n- _How the tables read:_ within each sweep, speedup is quoted against the smallest setting measured in that group (lowest worker count, or smallest batch size for step 2); parallel efficiency is speedup divided by the ideal linear speedup.\n\n### Test environment\n\n#### Local development laptop (Windows)\n\nThe 500-file Step 1 / Step 3 sweeps and preflight checks were run here. Both installs share the same machine; only the torch wheel differs (shared rows are merged).\n<table>\n<thead><tr><th>item</th><th>CPU1.1</th><th>GPU1.1</th></tr></thead>\n<tbody>\n<tr><td>CPU</td><td colspan='2'>Intel64 Family 6 Model 186 Stepping 2, GenuineIntel</td></tr>\n<tr><td>Cores</td><td colspan='2'>14 physical / 20 logical</td></tr>\n<tr><td>RAM</td><td colspan='2'>31.7 GB</td></tr>\n<tr><td>GPU (nvidia-smi)</td><td colspan='2'>NVIDIA RTX 2000 Ada Generation Laptop GPU, 8188 MiB, 595.71, 8.9</td></tr>\n<tr><td>torch</td><td>2.9.1+cpu (cuda None)</td><td>2.9.1+cu130 (cuda 13.0)</td></tr>\n<tr><td>cuda_available</td><td>False</td><td>True</td></tr>\n<tr><td>hoops_ai</td><td colspan='2'>1.1.0</td></tr>\n<tr><td>OS / Python</td><td colspan='2'>Windows-11-10.0.26100-SP0 / 3.12.10</td></tr>\n</tbody></table>\n\n## Step 1 - CAD encoding (DataPrep)\n\n### max_workers scaling\n\n**CPU1.1, n=500 files** (speedup relative to max_workers=4)\n\n<table>\n<thead><tr><th>max_workers</th><th>time (s)</th><th>files/s</th><th>speedup</th><th>parallel eff.</th><th>peak RSS (MB)</th><th>failed</th></tr></thead>\n<tbody>\n<tr><td>4</td><td>129.4</td><td>3.86</td><td>1.00x</td><td>100%</td><td>2790</td><td>0</td></tr>\n<tr><td>6</td><td>109.0</td><td>4.59</td><td>1.19x</td><td>79%</td><td>3943</td><td>0</td></tr>\n<tr><td>8</td><td>105.7</td><td>4.73</td><td>1.22x</td><td>61%</td><td>4974</td><td>0</td></tr>\n<tr><td>10</td><td>104.3</td><td>4.79</td><td>1.24x</td><td>50%</td><td>6330</td><td>0</td></tr>\n<tr class='peak'><td>12</td><td>103.0</td><td>4.85</td><td>1.26x</td><td>42%</td><td>7378</td><td>0</td></tr>\n<tr><td>14</td><td>106.9</td><td>4.68</td><td>1.21x</td><td>35%</td><td>8515</td><td>0</td></tr>\n<tr><td>16</td><td>105.1</td><td>4.76</td><td>1.23x</td><td>31%</td><td>9514</td><td>0</td></tr>\n<tr><td>18</td><td>107.9</td><td>4.63</td><td>1.20x</td><td>27%</td><td>10693</td><td>0</td></tr>\n</tbody></table>\n\n**Fastest: max_workers = 12** (103.0 s, 4.85 files/s) - the shortest time in this group. (max_workers = 8 is within 3% - the cheapest setting at peak throughput.)\n\nAmdahl fit over max_workers=4..18: serial fraction f = **47.9%**, so the asymptotic ceiling is 2.1x no matter how many workers you add. Roughly max_workers = 4 reaches 80% of that ceiling.\n\n**GPU1.1, n=500 files** (speedup relative to max_workers=8)\n\n<table>\n<thead><tr><th>max_workers</th><th>time (s)</th><th>files/s</th><th>speedup</th><th>parallel eff.</th><th>peak RSS (MB)</th><th>failed</th></tr></thead>\n<tbody>\n<tr><td>8</td><td>120.1</td><td>4.16</td><td>1.00x</td><td>100%</td><td>8159</td><td>0</td></tr>\n<tr><td>10</td><td>126.4</td><td>3.96</td><td>0.95x</td><td>76%</td><td>9983</td><td>0</td></tr>\n<tr class='peak'><td>12</td><td>119.5</td><td>4.18</td><td>1.01x</td><td>67%</td><td>11745</td><td>0</td></tr>\n<tr><td>14</td><td>119.9</td><td>4.17</td><td>1.00x</td><td>57%</td><td>13870</td><td>0</td></tr>\n<tr><td>16</td><td>126.2</td><td>3.96</td><td>0.95x</td><td>48%</td><td>15354</td><td>0</td></tr>\n</tbody></table>\n\n**Fastest: max_workers = 12** (119.5 s, 4.18 files/s) - the shortest time in this group. (max_workers = 8 is within 3% - the cheapest setting at peak throughput.)\n\n> **The exact peak worker count is run-to-run noise, not a stable optimum.** Across repeated full sweeps the fastest max_workers has moved between 12 and 14 on CPU and between 10 and 12 on GPU, while every point from roughly the physical-core count upward stays within ~5% of the best. Read this as a flat plateau near the core count, not a single best value - do not tune the exact peak.\n\n### Encoding: does the venv matter?\n\nStep 1 is HOOPS Exchange + numpy on the CPU; the torch wheel should be irrelevant. Matching numbers below confirm the two installs are otherwise equivalent, which is what licenses the step 2/3 comparisons.\n\n**Like Step 3, Step 1 is CPU-bound - the GPU install buys nothing.** At max_workers=12, CPU 103.0 s vs GPU 119.5 s: the GPU install is **0.86x** the CPU throughput.\n\nMatched max_workers, CPU vs GPU:\n\n<table>\n<thead><tr><th>max_workers</th><th>CPU time (s)</th><th>GPU time (s)</th><th>GPU speedup</th></tr></thead>\n<tbody>\n<tr><td>8</td><td>105.7</td><td>120.1</td><td>0.88x</td></tr>\n<tr><td>10</td><td>104.3</td><td>126.4</td><td>0.83x</td></tr>\n<tr><td>12</td><td class='peak'>103.0</td><td class='peak'>119.5</td><td>0.86x</td></tr>\n<tr><td>14</td><td>106.9</td><td>119.9</td><td>0.89x</td></tr>\n<tr><td>16</td><td>105.1</td><td>126.2</td><td>0.83x</td></tr>\n</tbody></table>\n_Highlighted: the compared point (max_workers=12). GPU speedup = CPU time / GPU time; near 1.00x means the two installs are equivalent on this CPU-bound stage._\n\nMeasured during the GPU-venv run: GPU utilisation averaged **0.3%** (max 10%, 87 samples, 1181 MiB peak). The GPU is effectively idle - Step 1 does no model forward pass, so it runs on the CPU workers regardless of the installed torch wheel, and a GPU buys nothing for this stage.\n\n## Step 3 - embedding + FAISS indexing\n\n### num_workers scaling\n\n**CPU1.1, n=500 files** (speedup relative to num_workers=8)\n\n<table>\n<thead><tr><th>num_workers</th><th>time (s)</th><th>files/s</th><th>speedup</th><th>parallel eff.</th><th>peak RSS (MB)</th><th>failed</th></tr></thead>\n<tbody>\n<tr><td>8</td><td>95.6</td><td>5.23</td><td>1.00x</td><td>100%</td><td>6163</td><td>0</td></tr>\n<tr><td>10</td><td>97.1</td><td>5.15</td><td>0.98x</td><td>79%</td><td>7439</td><td>0</td></tr>\n<tr class='peak'><td>12</td><td>93.6</td><td>5.34</td><td>1.02x</td><td>68%</td><td>8708</td><td>0</td></tr>\n<tr><td>14</td><td>99.3</td><td>5.03</td><td>0.96x</td><td>55%</td><td>9864</td><td>0</td></tr>\n<tr><td>16</td><td>105.7</td><td>4.73</td><td>0.90x</td><td>45%</td><td>11036</td><td>0</td></tr>\n<tr><td>18</td><td>118.2</td><td>4.23</td><td>0.81x</td><td>36%</td><td>12162</td><td>0</td></tr>\n</tbody></table>\n\n**Fastest: num_workers = 12** (93.6 s, 5.34 files/s) - the shortest time in this group. (num_workers = 8 is within 3% - the cheapest setting at peak throughput.)\n\n**GPU1.1, n=500 files** (speedup relative to num_workers=8)\n\n<table>\n<thead><tr><th>num_workers</th><th>time (s)</th><th>files/s</th><th>speedup</th><th>parallel eff.</th><th>peak RSS (MB)</th><th>failed</th></tr></thead>\n<tbody>\n<tr><td>8</td><td>106.3</td><td>4.70</td><td>1.00x</td><td>100%</td><td>9290</td><td>0</td></tr>\n<tr class='peak'><td>10</td><td>104.1</td><td>4.80</td><td>1.02x</td><td>82%</td><td>11173</td><td>0</td></tr>\n<tr><td>12</td><td>106.0</td><td>4.72</td><td>1.00x</td><td>67%</td><td>12935</td><td>0</td></tr>\n<tr><td>14</td><td>111.7</td><td>4.48</td><td>0.95x</td><td>54%</td><td>14914</td><td>0</td></tr>\n<tr><td>16</td><td>170.3</td><td>2.94</td><td>0.62x</td><td>31%</td><td>16185</td><td>0</td></tr>\n<tr><td>18</td><td>492.6</td><td>1.01</td><td>0.22x</td><td>10%</td><td>17303</td><td>0</td></tr>\n</tbody></table>\n\n**Fastest: num_workers = 10** (104.1 s, 4.80 files/s) - the shortest time in this group. (num_workers = 8 is within 3% - the cheapest setting at peak throughput.)\n\n### CPU vs GPU\n\n**Step 3 indexing is CPU-bound - the GPU gives no benefit.** At each platform's peak, CPU 93.6 s (num_workers=12) vs GPU 104.1 s (num_workers=10): the GPU install is **0.90x** the CPU throughput (i.e. slower). Peak GPU memory was 0 MB in every indexing run - `embed_shape_batch` runs the B-rep encoding on CPU workers, so a GPU adds nothing here.\n\nMatched num_workers, CPU vs GPU:\n\n<table>\n<thead><tr><th>num_workers</th><th>CPU time (s)</th><th>GPU time (s)</th><th>GPU speedup</th></tr></thead>\n<tbody>\n<tr><td>8</td><td>95.6</td><td>106.3</td><td>0.90x</td></tr>\n<tr><td>10</td><td>97.1</td><td class='peak'>104.1</td><td>0.93x</td></tr>\n<tr><td>12</td><td class='peak'>93.6</td><td>106.0</td><td>0.88x</td></tr>\n<tr><td>14</td><td>99.3</td><td>111.7</td><td>0.89x</td></tr>\n<tr><td>16</td><td>105.7</td><td>170.3</td><td>0.62x</td></tr>\n<tr><td>18</td><td>118.2</td><td>492.6</td><td>0.24x</td></tr>\n</tbody></table>\n_Highlighted: each platform's peak (CPU num_workers=12, GPU num_workers=10). GPU speedup = CPU time / GPU time; below 1.00x means the GPU install is slower._\n\n## Caveats\n\n- Single machine, single run per configuration: differences under roughly 5% are inside run-to-run noise. Re-run a cell if a conclusion depends on a small gap.\n- The `parts500` sample was pre-filtered to be failure-free at the chosen worker timeout, so these numbers reflect the clean-data throughput, not robustness against problematic files.\n- Background load on the machine (including antivirus scanning the STEP files) affects the CPU-bound stages more than the GPU stage.\n");</script>
