<!doctype html><meta charset='utf-8'><html lang='en'><title>HOOPS AI 1.1 benchmark (AWS EC2)</title><style>body{font-family:-apple-system,Segoe UI,Meiryo,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;line-height:1.6;color:#1a1a1a}table{border-collapse:collapse;margin:1rem 0;font-size:14px}th,td{border:1px solid #ddd;padding:6px 10px;text-align:right}th{background:#f5f5f5;text-align:left}td:first-child,th:first-child{text-align:left}code{background:#f5f5f5;padding:1px 4px;border-radius:3px}h1,h2,h3{line-height:1.25}h2{border-bottom:2px solid #eee;padding-bottom:.3rem}tr.peak td{background:#fff3cd;font-weight:600}td.peak{background:#fff3cd;font-weight:600}</style>
<div id='c'></div>
<script src='https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js'></script>
<script>document.getElementById('c').innerHTML=marked.parse("# HOOPS AI 1.1 benchmark (AWS EC2) - CPU vs GPU\n\nMachine: **AWS g6.8xlarge** (AMD EPYC 16-core + NVIDIA L4). Dataset: `mechcad` heavy mechanical-CAD corpus - a 2,000-file subset for the Step 1 / Step 3 worker sweeps and the full 10,873-file corpus for the Step 2 CPU-vs-GPU training run.\nBenchmark runs: 17 succeeded, 0 failed or skipped. Raw data: `results/results.csv`, per-run logs in `logs/`.\n\nSee also the companion report for the other machine (`REPORT_local.*` / `REPORT_aws.*`).\n\n## Summary\n\nConclusions first; the supporting numbers and per-setting sweeps follow in each step's section.\n\n- **Step 1 (encoding) and Step 3 (embedding + indexing) are CPU-bound** - the GPU sits idle, so the GPU install buys nothing. Throughput scales with worker count up to roughly the machine's physical core count, then flattens.\n- **Step 2 (training) is the only GPU-bound stage** and the only place a GPU pays off. Because the model is trained with contrastive learning, batch_size changes the trained model, so the fair speed comparison fixes batch_size: at the tutorial default batch_size=64 (same model, same 10 epochs), on a **10,873-file heavy dataset** (AWS g6.8xlarge, NVIDIA L4) the GPU is about **5.4x faster** than the 16-core CPU (618 vs 114 s/epoch). The advantage grows with scale - on a tiny preflight it was only ~1.7x. Compare on `s/epoch`, not total wall (which includes a fixed start-up cost).\n- _How the tables read:_ within each sweep, speedup is quoted against the smallest setting measured in that group (lowest worker count, or smallest batch size for step 2); parallel efficiency is speedup divided by the ideal linear speedup.\n\n### Test environment\n\n#### AWS g6.8xlarge (EC2)\n\nHeavy-scale host: the 2,000-file Step 1 / Step 3 sweeps and the 10,000-file Step 2 CPU-vs-GPU run were executed here. Both installs share the same instance; only the torch wheel differs (shared rows are merged).\n<table>\n<thead><tr><th>item</th><th>CPU1.1</th><th>GPU1.1</th></tr></thead>\n<tbody>\n<tr><td>CPU</td><td colspan='2'>AMD EPYC 7R13 Processor</td></tr>\n<tr><td>Cores</td><td colspan='2'>16 physical / 32 logical</td></tr>\n<tr><td>RAM</td><td colspan='2'>121 GB</td></tr>\n<tr><td>GPU (nvidia-smi)</td><td colspan='2'>NVIDIA L4, 23034 MiB, 580.173.02, 8.9</td></tr>\n<tr><td>torch</td><td>2.9.1+cpu (cuda None)</td><td>2.9.1+cu130 (cuda 13.0)</td></tr>\n<tr><td>cuda_available</td><td>False</td><td>True</td></tr>\n<tr><td>hoops_ai</td><td colspan='2'>1.1.0</td></tr>\n<tr><td>OS / Python</td><td colspan='2'>Ubuntu 24.04.4 LTS / 3.12.3</td></tr>\n</tbody></table>\n\n## Step 1 - CAD encoding (DataPrep)\n\n### max_workers scaling\n\n**CPU1.1, n=2000 files** (speedup relative to max_workers=8)\n\n<table>\n<thead><tr><th>max_workers</th><th>time (s)</th><th>files/s</th><th>speedup</th><th>parallel eff.</th><th>peak RSS (MB)</th><th>failed</th></tr></thead>\n<tbody>\n<tr><td>8</td><td>1228.6</td><td>1.63</td><td>1.00x</td><td>100%</td><td>13648</td><td>41</td></tr>\n<tr><td>12</td><td>935.5</td><td>2.14</td><td>1.31x</td><td>88%</td><td>21129</td><td>41</td></tr>\n<tr><td>16</td><td>793.6</td><td>2.52</td><td>1.55x</td><td>77%</td><td>26392</td><td>41</td></tr>\n<tr><td>20</td><td>726.1</td><td>2.75</td><td>1.69x</td><td>68%</td><td>33274</td><td>41</td></tr>\n<tr class='peak'><td>24</td><td>710.6</td><td>2.81</td><td>1.73x</td><td>58%</td><td>40168</td><td>41</td></tr>\n</tbody></table>\n\n**Fastest: max_workers = 24** (710.6 s, 2.81 files/s) - the shortest time in this group. (max_workers = 20 is within 3% - the cheapest setting at peak throughput.)\n\nAmdahl fit over max_workers=8..24: serial fraction f = **6.8%**, so the asymptotic ceiling is 14.8x no matter how many workers you add. Roughly max_workers = 55 reaches 80% of that ceiling.\n\n> **The exact peak worker count is run-to-run noise, not a stable optimum.** Across repeated full sweeps the fastest max_workers has moved between 12 and 14 on CPU and between 10 and 12 on GPU, while every point from roughly the physical-core count upward stays within ~5% of the best. Read this as a flat plateau near the core count, not a single best value - do not tune the exact peak.\n\n### Encoding: does the venv matter?\n\nStep 1 is HOOPS Exchange + numpy on the CPU; the torch wheel should be irrelevant. Matching numbers below confirm the two installs are otherwise equivalent, which is what licenses the step 2/3 comparisons.\n\n**Like Step 3, Step 1 is CPU-bound - the GPU install buys nothing.** At max_workers=16, CPU 793.6 s vs GPU 794.2 s: the GPU install is **1.00x** the CPU throughput - within run-to-run noise, i.e. parity.\n\nBoth installs were run at max_workers=16 on the 2,000-file subset:\n\n<table>\n<thead><tr><th>install</th><th>encode time (s)</th><th>files/s</th></tr></thead>\n<tbody>\n<tr><td>CPU1.1</td><td>793.6</td><td>2.52</td></tr>\n<tr><td>GPU1.1</td><td>794.2</td><td>2.52</td></tr>\n</tbody></table>\nThe GPU install is neither faster nor slower because the encoding never touches the GPU.\n\n## Step 2 - training\n\n### Training speed - CPU vs GPU (10k heavy dataset)\n\nRan on **AWS g6.8xlarge** (AMD EPYC, 16 physical cores + **NVIDIA L4** GPU) against a **10,873-file** heavy mechanical-CAD corpus (`mechcad`), the full corpus behind the 2,000-file Step 1 / Step 3 subset above. Both devices train from scratch for 10 epochs with the **same dataset pointer**, batch_size=64, num_workers=0, matmul=high and a fixed seed, so the two runs produce the *same model* and the wall-clock gap is a pure CPU-vs-GPU speed test.\n\n**Why batch_size is held fixed.** This embedding model is trained with *contrastive learning* (SimCLR / NT-Xent): the batch supplies the in-batch negatives, so changing batch_size trains a *different* model. Holding batch_size=64 (the tutorial default) keeps the model identical and isolates device speed. At this scale each epoch is ~204 batches.\n\n**Submitted vs trained.** The 10,873 files are the *submitted* count. Step 1 encoding tolerates HOOPS AI's known **non-deterministic ~2% re-encode failures** (typically `division by zero` or `Data key 'graph' not found`, and a *different* set of files each run), so this run dropped **220** files and the model actually trained on the **10,653 successes**. These are separate from the 24 files pre-excluded from the file list - they cannot be filtered ahead of time because the failures are not repeatable.\n\n#### CPU vs GPU at identical settings (batch_size=64)\n\n**At 10,873 files - same model, same 10 epochs, same seed, only the device differs - the L4 GPU is 5.4x faster than the 16-core CPU:** CPU 618.0 vs GPU 114.2 s/epoch (10.3 vs 1.9 min/epoch). Over 10 epochs that is CPU 103 min vs GPU 19 min of training wall time.\n\n<table>\n<thead><tr><th>device</th><th>s/epoch</th><th>min/epoch</th><th>train wall (min)</th><th>peak RSS (MB)</th><th>peak GPU (MB)</th></tr></thead>\n<tbody>\n<tr><td>CPU (EPYC 16-core)</td><td>618.0</td><td>10.30</td><td>103.0</td><td>9868</td><td>-</td></tr>\n<tr><td>GPU (NVIDIA L4)</td><td>114.2</td><td>1.90</td><td>19.0</td><td>2785</td><td>9062</td></tr>\n</tbody></table>\n\n_Speedup = CPU s/epoch / GPU s/epoch = 618.0 / 114.2 = **5.4x**. The GPU also uses far less host RAM (peak RSS) because the heavy tensor work lives on the device.\n\n\n#### The GPU advantage grows with dataset scale\n\n<table>\n<thead><tr><th>dataset</th><th>CPU s/epoch</th><th>GPU s/epoch</th><th>GPU speedup</th></tr></thead>\n<tbody>\n<tr><td>30-file preflight (2 ep)</td><td>1.37</td><td>0.81</td><td>1.7x</td></tr>\n<tr><td>10,873-file full run (10 ep)</td><td>618.0</td><td>114.2</td><td>5.4x</td></tr>\n</tbody></table>\n\nOn a trivially small dataset the GPU wins by only ~1.7x - launch, host-to-device transfer and Python overhead dominate and the L4 is mostly idle. At 10,873 files (~204 batches/epoch) the GPU is fully fed and the speedup rises to **5.4x**. This matches the local 500-part finding (~1.5x) and the general rule: **the larger the training set, the more a GPU pays off for Step 2**.\n\n\n**Findings**\n\n- **Compare on s/epoch, not total wall.** Split/setup is a fixed cost; the marginal training cost is CPU 618.0 vs GPU 114.2 s/epoch (**5.4x**). Project longer runs from s/epoch.\n- **L4 memory headroom:** peak GPU 9062 MB at batch_size=64 - well under the L4's 23 GB, so larger batches or a bigger model would still fit.\n- **Host RAM:** CPU training peaked at 9.6 GB RSS vs the GPU run's 2.7 GB - offloading to the device cuts host memory pressure too.\n\n## Step 3 - embedding + FAISS indexing\n\n### num_workers scaling\n\n**CPU1.1, n=2000 files** (speedup relative to num_workers=8)\n\n<table>\n<thead><tr><th>num_workers</th><th>time (s)</th><th>files/s</th><th>speedup</th><th>parallel eff.</th><th>peak RSS (MB)</th><th>failed</th></tr></thead>\n<tbody>\n<tr><td>8</td><td>1279.8</td><td>1.56</td><td>1.00x</td><td>100%</td><td>13570</td><td>0</td></tr>\n<tr class='peak'><td>12</td><td>1108.6</td><td>1.80</td><td>1.15x</td><td>77%</td><td>19679</td><td>0</td></tr>\n<tr><td>16</td><td>1217.7</td><td>1.64</td><td>1.05x</td><td>53%</td><td>26356</td><td>0</td></tr>\n<tr><td>20</td><td>1357.2</td><td>1.47</td><td>0.94x</td><td>38%</td><td>32415</td><td>0</td></tr>\n<tr><td>24</td><td>1407.3</td><td>1.42</td><td>0.91x</td><td>30%</td><td>37583</td><td>0</td></tr>\n</tbody></table>\n\n_The **files/s** column counts input CAD files. These 2,000 files expand to **8,463 B-rep shapes** (~4.2 shapes/file - the heavy corpus is full of assemblies), and Step 3 embeds each shape: at the peak that is ~7.6 shapes/s._\n\n\n**Fastest: num_workers = 12** (1108.6 s, 1.80 files/s) - the shortest time in this group.\n\n## Caveats\n\n- Single machine, single run per configuration: differences under roughly 5% are inside run-to-run noise. Re-run a cell if a conclusion depends on a small gap.\n- The heavy `mechcad` files trigger HOOPS AI's known non-deterministic ~2% re-encode failures, so a few dozen files drop each run; the throughput figures are over the successfully processed files.\n- Background load on the machine (including antivirus scanning the STEP files) affects the CPU-bound stages more than the GPU stage.\n");</script>
