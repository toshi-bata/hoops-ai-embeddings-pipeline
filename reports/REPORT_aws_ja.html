<script>document.getElementById('c').innerHTML=marked.parse("# HOOPS AI 1.1 \u30d9\u30f3\u30c1\u30de\u30fc\u30af (AWS EC2) - CPU vs GPU\n\n\u30de\u30b7\u30f3: **AWS g6.8xlarge**\uff08AMD EPYC 16\u30b3\u30a2 + NVIDIA L4\uff09\u3002\u30c7\u30fc\u30bf\u30bb\u30c3\u30c8: **TMCAD v2**\uff08Truly Mechanical CAD Dataset; Zou & Zhu, 2025\uff09\u3002HOOPS AI \u30c1\u30e5\u30fc\u30c8\u30ea\u30a2\u30eb\u304c\u57cb\u3081\u8fbc\u307f\u7d22\u5f15\u5316\u306b\u4f7f\u7528\u3059\u308b\u30d8\u30d3\u30fc\u6a5f\u68b0CAD\u30b3\u30fc\u30d1\u30b9\u3067\u3001\u3053\u3053\u3067\u306f\u30ed\u30fc\u30ab\u30eb\u306e\u30d5\u30a9\u30eb\u30c0\u540d `mechcad` \u3068\u3057\u3066\u73fe\u308c\u308b\u3002Step 1 \u306e\u30ef\u30fc\u30ab\u30fc\u30b9\u30a4\u30fc\u30d7\u3001Step 2 \u306e CPU vs GPU \u5b66\u7fd2\u3001\u305d\u3057\u3066 Step 3 \u306e\u57cb\u3081\u8fbc\u307f + FAISS\u7d22\u5f15\u5316\uff08\u30c1\u30e5\u30fc\u30c8\u30ea\u30a2\u30eb\u306e\u4e8b\u524d\u5b66\u7fd2\u30e2\u30c7\u30eb `ts3d_2M_hoops_embeddings_SIGNAL-preview.ckpt` \u3092\u4f7f\u7528\uff09\u306e\u3059\u3079\u3066\u3067\u3001\u540c\u305810,715\u30d5\u30a1\u30a4\u30eb\u306e\u5168\u30b3\u30fc\u30d1\u30b9\u3092\u4f7f\u7528\u3002\u5f15\u7528\u3068\u30c0\u30a6\u30f3\u30ed\u30fc\u30c9\u306f README \u306e\u300cBenchmark dataset\u300d\u7bc0\u3092\u53c2\u7167\u3002\n\u30d9\u30f3\u30c1\u30de\u30fc\u30af\u5b9f\u884c: \u6210\u529f 34 \u4ef6\u3001\u5931\u6557/\u30b9\u30ad\u30c3\u30d7 0 \u4ef6\u3002\u751f\u30c7\u30fc\u30bf: `results/results.csv`\u3001\u5404\u5b9f\u884c\u30ed\u30b0\u306f `logs/`\u3002\n\n\u3082\u3046\u4e00\u65b9\u306e\u30de\u30b7\u30f3\u306e\u5bfe\u306b\u306a\u308b\u30ec\u30dd\u30fc\u30c8\u3082\u53c2\u7167\uff08`REPORT_local.*` / `REPORT_aws.*`\uff09\u3002\n\n## \u7d50\u8ad6\uff08\u8981\u7d04\uff09\n\n\u7d50\u8ad6\u3092\u5148\u306b\u8ff0\u3079\u308b\u3002\u88cf\u4ed8\u3051\u3068\u306a\u308b\u6570\u5024\u3068\u8a2d\u5b9a\u3054\u3068\u306e\u30b9\u30a4\u30fc\u30d7\u306f\u5404Step\u306e\u30bb\u30af\u30b7\u30e7\u30f3\u3092\u53c2\u7167\u
